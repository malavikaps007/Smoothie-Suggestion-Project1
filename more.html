    <script>

        function suggestSmoothie() {

            let number = prompt("Enter a number from 1-9");

            let smoothies = [

                "Strawberry Delight 🍓",
                "Mango Magic 🥭",
                "Green Detox 🥬",
                "Banana Bliss 🍌",
                "Berry Burst 🫐",
                "Chocolate Protein 🍫",
                "Pineapple Paradise 🍍",
                "Avocado Dream 🥑",
                "Peach Punch 🍑"

            ];

            if (number >= 1 && number <= 9) {

                let randomSmoothie =
                    smoothies[Math.floor(Math.random() * smoothies.length)];

                alert("You should try: " + randomSmoothie);

            }

            else {

                alert("Please enter a valid number from 1-9");

            }

        }

        function searchSmoothie() {

            let input =
                document.getElementById("searchInput").value.toLowerCase();

            let smoothies = {

                "peach": "🍑 Peach Ginger Glow Smoothie",
                "coconut": "🥥 Tropical Coconut Paradise",
                "raspberry": "🫐 Raspberry Oat Breakfast Smoothie",
                "avocado": "🥑 Avocado Spinach Power Smoothie",
                "watermelon": "🍉 Watermelon Mint Refresher",
                "apple": "🍎 Apple Cinnamon Shake"

            };

            if (smoothies[input]) {

                alert("Found: " + smoothies[input]);

            }

            else {

                alert("No smoothie found 😔");

            }

        }

    </script>
